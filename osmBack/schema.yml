  /api/products/stock-movements/:
    get:
      operationId: products_stock_movements_list
      description: |-
        ViewSet for Stock Movements

        Endpoints:
        - GET /stock-movements/ - List movements
        - POST /stock-movements/ - Add new movement (purchase, sale, adjustment, etc.)
        - GET /stock-movements/by_stock/{stock_id}/ - Movements for specific stock
      parameters:
      - in: query
        name: movement_type
        schema:
          type: string
          enum:
          - adjustment
          - damage
          - purchase
          - release
          - reserve
          - return
          - sale
          - transfer_in
          - transfer_out
        description: |-
          * `purchase` - Purchase/Restock
          * `sale` - Sale
          * `transfer_in` - Transfer In
          * `transfer_out` - Transfer Out
          * `adjustment` - Stock Adjustment
          * `damage` - Damage/Loss
          * `return` - Customer Return
          * `reserve` - Reserve Stock
          * `release` - Release Reserved
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: stock
        schema:
          type: integer
      tags:
      - products
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStockMovementList'
          description: ''
    post:
      operationId: products_stock_movements_create
      description: Create new stock movement with user logging
      tags:
      - products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockMovementCreateRequest'
