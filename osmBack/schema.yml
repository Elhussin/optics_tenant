        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - accounting
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccountingCategoryList'
          description: ''
    post:
      operationId: accounting_categories_create
      description: ViewSet for Accounting Categories
      tags:
      - accounting
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountingCategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountingCategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountingCategoryRequest'
        required: true
      responses:
