openapi: 3.0.3
info:
  title: API Documentation
  version: 1.0.0
  description: API for optics Management System
paths:
  /api/accounting/categories/:
    get:
      operationId: accounting_categories_list
      description: ViewSet for Accounting Categories
      parameters:
      - in: query
        name: category_type
        schema:
          type: string
          enum:
          - expense
          - income
        description: |-
          * `income` - Income
          * `expense` - Expense
