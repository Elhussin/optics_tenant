components:
  schemas:
    AccountSubtypeEnum:
      enum:
      - cash
      - bank
      - receivable
      - inventory
      - prepaid
      - fixed_asset
      - payable
      - accrued
      - tax_payable
      - deferred
      - loan
      - capital
      - retained
      - reserves
      - sales
      - service
      - other_income
      - salary
      - rent
      - utilities
      - supplies
      - marketing
      - other_expense
      - cost_of_goods
      type: string
      description: |-
        * `cash` - Cash
        * `bank` - Bank
        * `receivable` - Accounts Receivable
        * `inventory` - Inventory
        * `prepaid` - Prepaid Expenses
        * `fixed_asset` - Fixed Assets
        * `payable` - Accounts Payable
        * `accrued` - Accrued Expenses
        * `tax_payable` - Taxes Payable
        * `deferred` - Deferred Revenue
        * `loan` - Loans
        * `capital` - Capital
        * `retained` - Retained Earnings
        * `reserves` - Reserves
        * `sales` - Sales
        * `service` - Services
        * `other_income` - Other Income
        * `salary` - Salaries
        * `rent` - Rent
        * `utilities` - Utilities
        * `supplies` - Supplies
        * `marketing` - Marketing
        * `other_expense` - Other Expenses
        * `cost_of_goods` - Cost of Goods Sold
    AccountTypeEnum:
      enum:
      - asset
      - liability
      - equity
      - revenue
      - expense
      - cogs
      type: string
      description: |-
        * `asset` - Asset
        * `liability` - Liability
        * `equity` - Equity
        * `revenue` - Revenue
        * `expense` - Expense
        * `cogs` - Cost of Goods Sold
