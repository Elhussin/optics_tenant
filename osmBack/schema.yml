  /api/accounting/chart-of-accounts/:
    get:
      operationId: accounting_chart_of_accounts_list
      description: ViewSet for Chart of Accounts
      parameters:
      - in: query
        name: account_subtype
        schema:
          type: string
          enum:
          - accrued
          - bank
          - capital
          - cash
          - cost_of_goods
          - deferred
          - fixed_asset
          - inventory
          - loan
          - marketing
          - other_expense
          - other_income
          - payable
          - prepaid
          - receivable
          - rent
          - reserves
          - retained
          - salary
          - sales
          - service
          - supplies
          - tax_payable
          - utilities
        description: |-
          * `cash` - Cash
          * `bank` - Bank
          * `receivable` - Accounts Receivable
          * `inventory` - Inventory
          * `prepaid` - Prepaid Expenses
          * `fixed_asset` - Fixed Assets
          * `payable` - Accounts Payable
          * `accrued` - Accrued Expenses
          * `tax_payable` - Taxes Payable
          * `deferred` - Deferred Revenue
          * `loan` - Loans
          * `capital` - Capital
          * `retained` - Retained Earnings
          * `reserves` - Reserves
          * `sales` - Sales
          * `service` - Services
          * `other_income` - Other Income
          * `salary` - Salaries
          * `rent` - Rent
          * `utilities` - Utilities
          * `supplies` - Supplies
          * `marketing` - Marketing
          * `other_expense` - Other Expenses
          * `cost_of_goods` - Cost of Goods Sold
      - in: query
        name: account_type
        schema:
          type: string
          enum:
          - asset
          - cogs
          - equity
          - expense
          - liability
          - revenue
        description: |-
          * `asset` - Asset
          * `liability` - Liability
          * `equity` - Equity
          * `revenue` - Revenue
          * `expense` - Expense
          * `cogs` - Cost of Goods Sold
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: is_header
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - accounting
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedChartOfAccountsList'
          description: ''
    post:
      operationId: accounting_chart_of_accounts_create
      description: ViewSet for Chart of Accounts
      tags:
      - accounting
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChartOfAccountsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChartOfAccountsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChartOfAccountsRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartOfAccounts'
          description: ''
