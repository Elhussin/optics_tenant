#; 🔧 لتفعيل الحسابات الافتراضية:

# في Django shell
pdm run python manage.py shell

>>> from apps.accounting.services import AutoJournalService
>>> AutoJournalService.setup_default_accounts()


# 3. إنشاء القيود التلقائي (AutoJournalService):

# عند تأكيد فاتورة مبيعات:
AutoJournalService.create_sales_invoice_journal(invoice)
# مدين: ذمم العملاء/النقدية
# دائن: إيرادات المبيعات + ضريبة القيمة المضافة

# عند استلام دفعة:
AutoJournalService.create_payment_journal(payment)
# مدين: الصندوق/البنك
# دائن: ذمم العملاء

# عند مرتجع:
AutoJournalService.create_return_journal(invoice)
# عكس قيد المبيعات

# تكلفة البضاعة:
AutoJournalService.create_cogs_journal(invoice)
# مدين: تكلفة البضاعة المباعة
# دائن: المخزون




