          enum:
          - asset
          - cogs
          - equity
          - expense
          - liability
          - revenue
        description: |-
          * `asset` - Asset
          * `liability` - Liability
          * `equity` - Equity
          * `revenue` - Revenue
          * `expense` - Expense
          * `cogs` - Cost of Goods Sold
