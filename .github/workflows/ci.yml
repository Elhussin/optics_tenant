name: CI Pipeline

on:
  push:
    branches:
      - main
      - v2
      - next
  pull_request:
    branches:
      - main
      - v2
      - next

jobs:
  frontend-checks:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: osmFront

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run Linter
        run: bun run lint

      - name: Type Check
        run: bunx tsc --noEmit

      - name: Run Tests
        run: bun run test:ci

  backend-checks:
    name: Backend Check & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: osmBack

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: optics_user
          POSTGRES_PASSWORD: optics_password
          POSTGRES_DB: optics_tenant_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_NAME: optics_tenant_db
      DB_USER: optics_user
      DB_PASSWORD: optics_password
      DB_HOST: localhost
      DB_PORT: 5432
      SECRET_KEY: test-secret-key-123
      DEBUG: True

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDM
        run: pip install pdm

      - name: Install dependencies
        run: pdm install

      - name: Django Check
        run: pdm run python manage.py check

      - name: Run Tests
        run: pdm run pytest
